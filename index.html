<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}*{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}</style>
<title>戰利品分配主控台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* 三頁精靈：①戰利品 ②上傳資料(拍照辨識) ③分配。暖紙背景＋硃砂/青雙重點色 */
  :root{
    --bg:#f1e9da; --surface:#fbf6ec; --surface2:#f3ebdb;
    --ink:#2a2420; --muted:#6f6353; --line:#ddcfb6;
    --accent:#c8452f; --accent-soft:#f3d9cf;
    --jade:#2f7d6b; --jade-soft:#d5e7df;
    --gold:#b0801f; --gold-soft:#f0e2c0;
    --shadow:0 1px 2px rgba(60,42,20,.06),0 6px 20px rgba(60,42,20,.07);
    --r:14px;
    --font-head:"Noto Serif TC",Georgia,"Songti TC",serif;
    --font-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#1a1611; --surface:#241e17; --surface2:#2c251c; --ink:#ece3d4; --muted:#a89a85; --line:#3b3226;
    --accent:#e8714f; --accent-soft:#4a2b23; --jade:#57bca2; --jade-soft:#23372f; --gold:#d6a948; --gold-soft:#3a2f18;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#1a1611; --surface:#241e17; --surface2:#2c251c; --ink:#ece3d4; --muted:#a89a85; --line:#3b3226;
    --accent:#e8714f; --accent-soft:#4a2b23; --jade:#57bca2; --jade-soft:#23372f; --gold:#d6a948; --gold-soft:#3a2f18;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.55;font-size:15.5px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:40}
  h1,h2,h3{font-family:var(--font-head);font-weight:700;margin:0;line-height:1.25;text-wrap:balance}
  button{font-family:inherit;font-size:14px;cursor:pointer}
  a{color:var(--accent)}
  .tnum{font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}

  header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
  .top-inner{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
  .brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .seal{width:36px;height:36px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--font-head);font-size:20px;flex:0 0 auto;box-shadow:var(--shadow)}
  .brand h1{font-size:20px;letter-spacing:.5px}
  .brand .sub{font-size:12px;color:var(--muted)}
  .rolepill{margin-left:auto;font-size:12px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface2);white-space:nowrap}
  .rolepill.w{color:var(--jade);border-color:var(--jade)}
  .tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{border:none;background:none;color:var(--muted);padding:9px 13px;border-radius:9px 9px 0 0;white-space:nowrap;font-weight:600;font-size:15px;border-bottom:2px solid transparent}
  .tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);background:var(--surface2)}

  main{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 70px}
  .banner{display:flex;gap:10px;align-items:flex-start;background:var(--gold-soft);border:1px solid var(--gold);color:var(--ink);border-radius:var(--r);padding:11px 14px;font-size:13px;margin-bottom:16px}
  .banner.info{background:var(--jade-soft);border-color:var(--jade)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
  .card h2{font-size:18px;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card .hint{color:var(--muted);font-size:13px;margin-bottom:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .stephead{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:1px;margin-bottom:2px}

  .btn{border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:9px 15px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:6px;font-size:14px}
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.jade{background:var(--jade);border-color:var(--jade);color:#fff}
  .btn.big{padding:12px 18px;font-size:15px}
  .btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .next{display:flex;justify-content:flex-end;margin-top:4px}
  select,input[type=text],input[type=number]{font-family:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);max-width:100%}
  input[type=number]{width:84px}
  textarea{width:100%;font-family:inherit;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:84px;resize:vertical}
  label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .chip.role{font-weight:600}
  .chip.r-族長,.chip.r-副族長{color:var(--accent);border-color:var(--accent)}
  .chip.r-內務管家,.chip.r-核心成員{color:var(--gold);border-color:var(--gold)}
  .chip.wish{background:var(--jade-soft);border-color:var(--jade);color:var(--jade)}
  .chip.got{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
  .chip .del{cursor:pointer;font-weight:700;opacity:.6}
  .chip .del:hover{opacity:1}
  .kpi{display:flex;gap:20px;flex-wrap:wrap}
  .kpi .b{font-family:var(--font-head);font-size:26px;line-height:1}
  .kpi .l{font-size:12px;color:var(--muted);margin-top:3px}

  /* 戰利品列（步驟一／三共用） */
  .lootrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
  .lootrow:first-of-type{border-top:none}
  .lootrow .nm{flex:1 1 140px;font-weight:700}
  .lootrow .rem{font-family:var(--font-head);font-size:16px}
  .lootrow .rem.zero{color:var(--accent)}

  /* 上傳區塊 */
  .up{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px;background:var(--surface)}
  .up h3{font-size:16px;display:flex;align-items:center;gap:8px}
  .up .tag{font-size:11px;font-weight:700;color:var(--jade);background:var(--jade-soft);border:1px solid var(--jade);border-radius:999px;padding:1px 8px}
  .up .st{font-size:13px;color:var(--muted);margin:6px 0 10px}
  .up .st.ok{color:var(--jade);font-weight:600}
  .up .st.err{color:var(--accent);font-weight:600}
  .dropz{border:1.5px dashed var(--muted);border-radius:11px;padding:16px;text-align:center;background:var(--surface2);cursor:pointer}
  .dropz b{color:var(--accent)}
  .preview{margin-top:10px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:200px;overflow:auto}
  .preview ol{margin:0;padding-left:22px;font-size:13.5px}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  details.paste{margin-top:8px}
  details.paste>summary{font-size:13px;color:var(--muted);cursor:pointer;font-weight:600}

  /* 分配：庫存＋成員卡 */
  .stock{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
  .spill{flex:0 0 auto;border:1px solid var(--line);border-radius:11px;padding:8px 11px;min-width:96px;background:var(--surface2)}
  .spill .in{font-size:12.5px;font-weight:700;white-space:nowrap}
  .spill .iq{font-family:var(--font-head);font-size:18px;margin-top:2px}
  .spill .iq small{font-size:11px;color:var(--muted);font-family:var(--font-body)}
  .spill.zero{border-color:var(--accent)}
  .spill.zero .iq,.spill.zero .in{color:var(--accent)}
  .warnbar{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);font-weight:700;font-size:13.5px;border-radius:10px;padding:9px 12px;margin-bottom:10px}
  .mcard{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:12px 13px;margin-bottom:10px}
  .mcard.wanted{border-color:var(--jade);box-shadow:0 0 0 2px var(--jade-soft)}
  .mtop{display:flex;align-items:center;gap:11px}
  .mrank{font-family:var(--font-head);font-size:15px;width:32px;height:32px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;flex:0 0 auto;color:var(--muted)}
  .mrank.top{background:var(--accent);color:#fff}
  .minfo{flex:1 1 auto;min-width:0}
  .minfo .mn{font-weight:700;font-size:16px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .minfo .mm{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:9px;flex-wrap:wrap}
  .score{font-family:var(--font-head);font-weight:700;color:var(--ink)}
  .arank{color:var(--jade);font-weight:600}
  .tierbadge{font-weight:800;font-family:var(--font-head);border-radius:6px;padding:0 7px;color:#fff}
  .tierbadge.t3{background:var(--accent)} .tierbadge.t2{background:var(--gold)} .tierbadge.t1{background:var(--jade)} .tierbadge.t0{background:var(--surface2);color:var(--muted)}
  .give{flex:0 0 auto}
  .give3{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:300px}
  .give3 select{min-width:84px;flex:0 0 auto;font-size:12.5px;padding:6px 4px}
  .give3 select.has{border-color:var(--jade);color:var(--jade);font-weight:700}
  @media(max-width:560px){.give3{max-width:150px}.give3 select{min-width:70px}}
  .mchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .mchips .lbl{font-size:11px;color:var(--muted);font-weight:700}
  .want-tag{font-size:12px;color:var(--jade);font-weight:700}

  table{width:100%;border-collapse:collapse;font-size:14.5px}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  th,td{padding:10px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:12px;color:var(--muted);font-weight:700;background:var(--surface2)}
  tr:last-child td{border-bottom:none}
  td.name{font-weight:700;white-space:nowrap}
  .statusdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--jade);margin-right:6px}
  .statusdot.g{background:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:24px 10px}
  details.help{border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-bottom:10px;background:var(--surface)}
  details.help>summary{padding:13px 0;font-weight:700;cursor:pointer;font-family:var(--font-head);font-size:15px}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:14.5px;font-weight:600;box-shadow:var(--shadow);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  #toast.err{background:var(--accent);color:#fff}
  .iic{width:1.85em;height:1.85em;border-radius:5px;object-fit:cover;vertical-align:-0.5em;box-shadow:0 1px 2px rgba(0,0,0,.18)}
  @media (max-width:560px){th,td{padding:8px 8px}.kpi{gap:14px}.kpi .b{font-size:23px}}
</style>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="seal">戰</div>

</header>
<main id="view"><div class="empty">載入中…</div></main>
<div id="toast"></div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>

async function guardWrite(fn){if(!dbLive){toast("尚未連上資料庫，無法儲存",true);return;}if(!canWrite){toast("此帳號為唯讀，無法編輯",true);return;}try{await fn();}catch(e){console.error(e);toast("儲存失敗："+(e&&e.code||"錯誤"),true);}}
function names(){return state.roster.map(m=>m.name);}
function activeRound(){const id=state.config.activeRoundId;if(id&&state.rounds[id])return{id,...state.rounds[id]};const live=Object.entries(state.rounds).filter(([,r])=>r.status!=="已封存").sort((a,b)=>(b[1].date||"").localeCompare(a[1].date||""));return live[0]?{id:live[0][0],...live[0][1]}:null;}
function allocOf(id){return state.allocs.filter(a=>a.roundId===id);}
function wishOf(id){return state.wishes.filter(w=>w.roundId===id);}
function remainingMap(round){const used={};allocOf(round.id).forEach(a=>{used[a.item]=(used[a.item]||0)+Number(a.qty||0);});const m={};(round.loot||[]).forEach(l=>{m[l.item]=Number(l.total||0)-(used[l.item]||0);});return m;}

/* 名字比對（自動排除非家族） */
function matchName(raw){
  const s=String(raw||"").trim();if(!s)return null;const ns=names();
  if(ns.includes(s))return s;
  const cleaned=s.replace(/^[\s\d.、，,:：#＃)\]．]+/,"").replace(/[\s\d]+$/,"").trim();
  if(ns.includes(cleaned))return cleaned;
  for(const t of cleaned.split(/[\s,，、|]+/)) if(ns.includes(t)) return t;
  return null;
}

/* 綜合評分：貢獻積分(0-100,依分數) + 活動積分(0-100,三活動排名平均) */
function actList(round){var out=ACTS.slice();var cs=(round&&Array.isArray(round.activityList))?round.activityList:[];cs.forEach(function(a){if(out.indexOf(a)<0)out.push(a);});Object.keys((round&&round.activities)||{}).forEach(function(a){if(out.indexOf(a)<0)out.push(a);});return out;}
async function addActivity(name){name=(name||"").trim();if(!name){toast("請輸入活動名稱",true);return;}const r=activeRound();if(!r){toast("請先建立分配期",true);return;}if(actList(r).indexOf(name)>=0){toast("已有這個活動",true);return;}const al=Array.isArray(r.activityList)?r.activityList.slice():[];al.push(name);await guardWrite(async()=>{await saveRound(r.id,{activityList:al});toast("已新增活動："+name);});}
async function delActivity(name){const r=activeRound();if(!r)return;const al=(Array.isArray(r.activityList)?r.activityList:[]).filter(a=>a!==name);const acts={...(r.activities||{})};delete acts[name];delete upUI[name];await guardWrite(async()=>{await saveRound(r.id,{activityList:al,activities:acts});toast("已刪除活動："+name);});}
function computeScores(round){
  const normal=state.roster.filter(m=>m.status==="正常");
  const c=round.contributions||{},acts=round.activities||{};
  const maxC=Math.max(1,...normal.map(m=>Number(c[m.name]||0)));
  const list=actList(round).filter(k=>(acts[k]||[]).length>0);
  const aPts={},aRank={};
  list.forEach(k=>{const arr=acts[k]||[],kk=arr.length;arr.forEach((nm,i)=>{(aPts[nm]=aPts[nm]||{})[k]=kk?(kk-i)/kk*100:0;(aRank[nm]=aRank[nm]||{})[k]=i+1;});});
  return normal.map(m=>{
    const cv=Number(c[m.name]||0),cS=cv/maxC*100;
    const ap=aPts[m.name]||{};let sum=0;list.forEach(k=>{sum+=(ap[k]||0);});
    const aAvg=list.length?sum/list.length:0;
    return{name:m.name,role:m.role,cv,cS,aAvg,rank:aRank[m.name]||{},composite:cS+aAvg};
  }).sort((a,b)=>b.composite-a.composite||b.cv-a.cv);
}
function tiersFrom(scored){const have=scored.filter(x=>x.composite>0),n=have.length,t3=Math.ceil(n/3),t2=Math.ceil(n*2/3),t={};have.forEach((x,i)=>t[x.name]=i<t3?3:i<t2?2:1);return t;}

const API_BASE="https://fjqishllglruchsoyscl.supabase.co/functions/v1/loot";
let MGR_PASS=(()=>{try{return localStorage.getItem("loot_pass")||""}catch(e){return ""}})();
async function api(action,extra){
  const res=await fetch(API_BASE,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.assign({action,pass:MGR_PASS},extra||{}))});
  let j={};try{j=await res.json();}catch(e){}
  if(!res.ok){if(res.status===401){MGR_PASS="";try{localStorage.removeItem("loot_pass")}catch(e){}canWrite=false;updateRolePill();toast("委託人密碼錯誤，請重新登入",true);}throw (j&&j.error)||("http"+res.status);}
  if(action!=="state"&&action!=="checkPass"&&action!=="ocr")setTimeout(pull,150);
  return j;
}
const _docCb={},_collCb={};
const DBSHIM={
  doc:(path)=>({set:(data)=>api("setDoc",{path,data}),delete:()=>api("delDoc",{path}),onSnapshot:(cb)=>{_docCb[path]=cb;return ()=>{delete _docCb[path]};}}),
  collection:(coll)=>({add:(data)=>api("addDoc",{coll,data}),onSnapshot:(cb)=>{_collCb[coll]=cb;return ()=>{delete _collCb[coll]};}})
};
let _lastJson="";
async function pull(){
  let st;try{st=await api("state");}catch(e){return;}
  const _j=JSON.stringify(st);if(_j===_lastJson)return;_lastJson=_j;
  if(_docCb["app/roster"])_docCb["app/roster"]({data:()=>({members:st.roster})});
  if(_docCb["app/config"])_docCb["app/config"]({data:()=>st.config});
  if(_collCb["rounds"])_collCb["rounds"]({docs:Object.entries(st.rounds).map(([id,d])=>({id,data:()=>d}))});
  if(_collCb["wishes"])_collCb["wishes"]({docs:st.wishes.map(w=>({id:w.id,data:()=>w}))});
  if(_collCb["allocations"])_collCb["allocations"]({docs:st.allocs.map(a=>({id:a.id,data:()=>a}))});
}
async function connect(){
  sampleOK=true;canWrite=!!MGR_PASS;DB=DBSHIM;USER=null;
  const pill=$("#rolePill");if(pill)pill.onclick=loginToggle;
  updateRolePill();subscribe();
  await pull();render();
  setInterval(pull,6000);

}
async function loginToggle(){
  if(canWrite){if(confirm("登出委託人模式？")){MGR_PASS="";try{localStorage.removeItem("loot_pass")}catch(e){}canWrite=false;updateRolePill();render();}return;}
  const p=prompt("輸入委託人密碼（族長／副族長）");if(!p)return;
  try{const r=await fetch(API_BASE,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"checkPass",pass:p})});const j=await r.json();if(j&&j.ok){MGR_PASS=p;try{localStorage.setItem("loot_pass",p)}catch(e){}canWrite=true;updateRolePill();render();toast("委託人登入成功");}else{toast("密碼錯誤",true);}}catch(e){toast("登入失敗，稍後再試",true);}
}
function updateRolePill(){const p=$("#rolePill");if(!p)return;p.style.cursor="pointer";if(canWrite){p.textContent="委託人 · 可編輯（點此登出）";p.className="rolepill w";}else{p.textContent="成員檢視 · 點此委託人登入";p.className="rolepill";}}
function subscribe(){
  let got=false;const timer=setTimeout(()=>{if(!got)toast("資料庫連線中…若持續空白，請確認帳號權限");},10000);
  const done=()=>{if(!got){got=true;dbLive=true;clearTimeout(timer);updateRolePill();}render();};
  const onErr=e=>{console.error("db",e);toast("資料庫錯誤："+(e&&e.code||""),true);};
  subs.push(DB.doc("app/roster").onSnapshot(s=>{const d=s.data();if(d&&Array.isArray(d.members)&&d.members.length)state.roster=d.members;done();},onErr));
  subs.push(DB.doc("app/config").onSnapshot(s=>{const d=s.data();if(d)state.config=d;done();},onErr));
  subs.push(DB.collection("rounds").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());state.rounds=o;done();},onErr));
  subs.push(DB.collection("wishes").onSnapshot(s=>{state.wishes=s.docs.map(d=>({id:d.id,...d.data()}));done();},onErr));
  subs.push(DB.collection("allocations").onSnapshot(s=>{state.allocs=s.docs.map(d=>({id:d.id,...d.data()}));done();},onErr));
}

async function saveRound(id,patch){const r=state.rounds[id]||{};await DB.doc("rounds/"+id).set({...r,...patch});}
async function createRound(name,dateStr){const id="r"+Date.now();await guardWrite(async()=>{await DB.doc("rounds/"+id).set({name:name||("分配期 "+dateStr),date:dateStr,status:"進行中",loot:[],contributions:{},activities:{}});await DB.doc("app/config").set({...state.config,activeRoundId:id});toast("已建立："+(name||dateStr));});}
async function archiveActive(){const r=activeRound();if(!r)return;await guardWrite(async()=>{await saveRound(r.id,{status:"已封存"});await DB.doc("app/config").set({...state.config,activeRoundId:null});toast("本期已封存");});}
async function resetWeek(){const r=activeRound();if(!r)return;if(!confirm("重置本期統計？\n\n會清空：貢獻分數、三個活動名次、所有許願、所有分配結果。\n保留：戰利品清單、成員名單。\n\n此動作無法復原。"))return;try{await api("resetRound",{roundId:r.id});toast("本期統計已重置");await pull();render();}catch(e){toast("重置失敗，請稍後再試",true);}}
async function addLoot(item,total){const r=activeRound();if(!r){toast("請先建立分配期",true);return;}item=(item||"").trim();total=Math.max(1,Number(total)||1);if(!item)return;const loot=(r.loot||[]).slice();const ex=loot.find(l=>l.item===item);if(ex)ex.total=Number(ex.total||0)+total;else loot.push({item,total});await guardWrite(async()=>{await saveRound(r.id,{loot});toast("入庫："+item+"×"+total);});}
async function setLootTotal(item,total){const r=activeRound();if(!r)return;total=Math.max(0,Number(total)||0);await guardWrite(async()=>{await saveRound(r.id,{loot:(r.loot||[]).map(l=>l.item===item?{...l,total}:l)});});}
function lootStep(item,d){const r=activeRound();if(!r)return;const cur=(r.loot||[]).find(x=>x.item===item);if(!cur)return;const nt=Math.max(0,Number(cur.total||0)+d);const loot=(r.loot||[]).map(x=>x.item===item?{...x,total:nt}:x);if(state.rounds[r.id])state.rounds[r.id].loot=loot;render();guardWrite(async()=>{await saveRound(r.id,{loot});});}
async function delLoot(item){const r=activeRound();if(!r)return;await guardWrite(async()=>{await saveRound(r.id,{loot:(r.loot||[]).filter(l=>l.item!==item)});});}
async function addWish(member,item){if(!item||!member)return;const r=activeRound();if(!r){toast("尚無分配期",true);return;}try{await DB.collection("wishes").add({roundId:r.id,member,item,ts:Date.now()});toast("已許願："+member+" → "+item);}catch(e){toast("許願失敗，請稍後再試",true);}}
async function delWish(id){try{await DB.doc("wishes/"+id).delete();}catch(e){toast("刪除失敗",true);}}
async function addAlloc(member,item){const r=activeRound();if(!r)return;const got=allocOf(r.id).filter(a=>a.member===member).reduce((s,a)=>s+Number(a.qty||0),0);if(got>=3){toast(member+" 已領滿 3 件（每人最多 3 個）",true);return;}const rem=remainingMap(r)[item]??0;if(rem<1){toast("「"+item+"」已分完，數量不夠！",true);return;}await guardWrite(async()=>{await DB.collection("allocations").add({roundId:r.id,member,item,qty:1,ts:Date.now()});toast("✓ "+item+" → "+member+"，剩 "+(rem-1));});}
async function delAlloc(id){await guardWrite(async()=>{await DB.doc("allocations/"+id).delete();});}
async function changeSlot(member,allocid,item){const r=activeRound();if(!r)return;if(!allocid&&!item)return;await guardWrite(async()=>{if(allocid)await DB.doc("allocations/"+allocid).delete();if(item)await DB.collection("allocations").add({roundId:r.id,member,item,qty:1,ts:Date.now()});toast(item?("✓ "+item+" → "+member):(member+" 已清除一格"));});}

/* ---------- 影像辨識（排除非家族） ---------- */
function sampleErr(c){return({not_granted:"你尚未允許使用 Claude 辨識",rate_limited:"用量達上限，稍後再試",images_unavailable:"此裝置不支援照片辨識，請改貼文字",image_rejected:"照片格式不符或太大",refused:"無法辨識此照片",invalid_json:"辨識結果無法解析，請重拍或改貼文字",session_expired:"請重新登入"})[c]||"辨識失敗，請再試一次";}
function fileToPart(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const s=String(r.result);resolve({media_type:(f.type||"image/jpeg"),data:s.slice(s.indexOf(",")+1)});};r.onerror=reject;r.readAsDataURL(f);});}
function parseLoose(t){if(!t)throw{code:"invalid_json"};const a=t.indexOf("["),b=t.lastIndexOf("]");if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e){}}throw{code:"invalid_json"};}
async function runOCR(key,files){
  const imgs=await Promise.all(Array.from(files).slice(0,6).map(fileToPart));
  const res=await api("ocr",{mode:(key==="contrib"?"score":"rank"),images:imgs});
  return parseLoose(res&&res.text);
}
async function handleFiles(files){
  const key=pendingUpKey;pendingUpKey=null;if(!key||!files||!files.length)return;
  if(key==="roster")return rosterFiles(files);
  upUI[key]={status:"loading"};render();
  try{
    const raw=await runOCR(key,files);
    if(key==="contrib"){
      const matched=[],seen=new Set();let dropped=0;
      (Array.isArray(raw)?raw:[]).forEach(o=>{const nm=matchName(o&&o.name);if(nm&&!seen.has(nm)){seen.add(nm);matched.push({name:nm,score:Number(String(o.score).replace(/[^\d]/g,""))||0});}else if(o&&o.name)dropped++;});
      upUI[key]={status:"done",contrib:matched,dropped};
    }else{
      const order=[],seen=new Set();let dropped=0;
      (Array.isArray(raw)?raw:[]).forEach(n=>{const nm=matchName(n);if(nm&&!seen.has(nm)){seen.add(nm);order.push(nm);}else if(String(n).trim())dropped++;});
      upUI[key]={status:"done",names:order,dropped};
    }
    render();
  }catch(e){console.error(e);upUI[key]={status:"err",msg:sampleErr(e&&e.code)};render();toast(sampleErr(e&&e.code),true);}
}
async function confirmUpload(key){
  const u=upUI[key];if(!u||u.status!=="done")return;const r=activeRound();if(!r){toast("請先建立分配期",true);return;}
  if(key==="contrib"){const c={...(r.contributions||{})};u.contrib.forEach(x=>c[x.name]=x.score);await guardWrite(async()=>{await saveRound(r.id,{contributions:c});});}
  else{const acts={...(r.activities||{})};acts[key]=u.names;await guardWrite(async()=>{await saveRound(r.id,{activities:acts});});}
  upUI[key]={status:"saved"};toast("已儲存 "+(key==="contrib"?"貢獻":key));render();
}
function importPaste(key,text){
  if(!text.trim())return toast("請先貼上內容",true);
  if(key==="contrib"){const matched=[],seen=new Set();let dropped=0;text.split(/\n+/).forEach(line=>{const mt=line.trim().match(/^(.+?)[\s,，\t]+([\d,]+)\s*$/);if(!mt)return;const nm=matchName(mt[1]);if(nm&&!seen.has(nm)){seen.add(nm);matched.push({name:nm,score:Number(mt[2].replace(/,/g,""))||0});}else dropped++;});upUI[key]={status:"done",contrib:matched,dropped};}
  else{const order=[],seen=new Set();let dropped=0;text.split(/\n+/).forEach(line=>{const nm=matchName(line);if(nm&&!seen.has(nm)){seen.add(nm);order.push(nm);}else if(line.trim())dropped++;});upUI[key]={status:"done",names:order,dropped};}
  render();
}

function upBlock(key,label,desc,tag,del){
  const u=upUI[key]||{};let body="";
  if(u.status==="loading")body=`<div class="st"><span class="spin"></span>辨識中…（第一次會請你允許使用 Claude，約數秒～數十秒）</div>`;

        ${(myW.length||myA.length||canWrite)?`<div class="mchips">
          ${myW.length?`<span class="lbl">許願</span>${myW.map(w=>`<span class="chip wish">${iconFor(w.item)} ${esc(w.item)}${canWrite?` <span class="del" data-act="delWish" data-id="${w.id}">✕</span>`:""}</span>`).join("")}`:""}
          ${myA.length?`<span class="lbl">已拿</span>${myA.map(a=>`<span class="chip got">${iconFor(a.item)} ${esc(a.item)}${canWrite?` <span class="del" data-act="delAlloc" data-id="${a.id}">✕</span>`:""}</span>`).join("")}`:""}
          ${canWrite?`<select data-wishfor="${esc(x.name)}"><option value="">＋許願</option>${COMMON_ITEMS.map(it=>`<option>${esc(it)}</option>`).join("")}</select>`:""}
        </div>`:""}
      </div>`;
    }).join("")}
  </div>
  <div class="card"><h2>產生分配清單</h2><p class="hint">複製貼到家族社群公告。</p>
    <div class="row"><button class="btn primary" data-act="exportAnn">產生清單</button>${canWrite?`<button class="btn" data-act="resetWeek">🔄 重置本期統計</button> <button class="btn" data-act="archive">封存本期</button>`:""}</div>
    <div id="annWrap"></div></div>`;
}

function renderRoster(){
  const v=$("#view"),c=(activeRound()||{}).contributions||{};
  const byRole={};ROLE_ORDER.forEach(r=>byRole[r]=[]);state.roster.forEach(m=>{(byRole[m.role]||(byRole[m.role]=[])).push(m);});
  const normal=state.roster.filter(m=>m.status==="正常").length,ghost=state.roster.length-normal;
  v.innerHTML=`${bannerLive()}<div class="card"><h2>成員名單 <span class="chip">${state.roster.length} 人</span></h2>
    <div class="kpi" style="margin-top:8px"><div><div class="b tnum">${normal}</div><div class="l">正常（可分配）</div></div><div><div class="b tnum">${ghost}</div><div class="l">幽靈（不分配）</div></div></div>
    <p class="hint" style="margin-top:12px">${canWrite?"點「切換」把長期不活躍的人設為幽靈，分配時就不會出現。":"唯讀檢視。"}</p></div>
  ${canWrite?`<div class="card"><h2 style="font-size:16px">➕ 新增成員</h2>
    <p class="hint">新進夥伴可直接手動輸入，或上傳成員截圖自動辨識。</p>
    <div class="row" style="margin-top:6px">
      <input type="text" id="newMemName" placeholder="成員名字" style="flex:1 1 150px">
      <select id="newMemRole">${ROLE_ORDER.map(r=>`<option${r==="普通成員"?" selected":""}>${esc(r)}</option>`).join("")}</select>
      <button class="btn primary" data-act="addMember">新增</button>
    </div>
    <div class="dropz" data-act="pick" data-key="roster" style="margin-top:12px"><b>📷 上傳成員截圖</b>（可多張）<div class="muted" style="font-size:12px;margin-top:3px">自動讀取名字，挑出名單上還沒有的人</div></div>
    <details class="paste" style="margin-top:8px"><summary>或改貼文字（每行一個名字）</summary><label class="fld" style="margin-top:8px"><textarea id="pz_roster" placeholder="新成員一\n新成員二"></textarea></label><button class="btn sm" data-act="pasteRoster" style="margin-top:6px">讀取名字</button></details>
    ${rosterReview()}
  </div>`:""}
  ${ROLE_ORDER.filter(role=>byRole[role]&&byRole[role].length).map(role=>`<div class="card"><h2 style="font-size:16px">${roleChip(role)} <span class="muted" style="font-weight:400;font-size:13px">${byRole[role].length} 人</span></h2>
    <div class="tablewrap" style="margin-top:8px"><table><tbody>${byRole[role].map(m=>`<tr><td class="name"><span class="statusdot ${m.status==="幽靈"?"g":""}"></span>${esc(m.name)}</td><td class="tnum muted">貢獻 ${fmt(c[m.name]||0)}</td><td style="text-align:right">${m.status==="幽靈"?'<span class="chip">幽靈</span>':'<span class="chip wish">正常</span>'}${canWrite?` <button class="btn sm" data-act="toggleGhost" data-name="${esc(m.name)}" style="margin-left:6px">切換</button>`:""}</td></tr>`).join("")}</tbody></table></div></div>`).join("")}`;
}
function renderHistory(){
  const v=$("#view");const rounds=Object.entries(state.rounds).map(([id,r])=>({id,...r})).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const tally={};state.allocs.forEach(a=>{const t=tally[a.member]||(tally[a.member]={qty:0,rounds:new Set()});t.qty+=Number(a.qty||0);t.rounds.add(a.roundId);});
  const trows=Object.entries(tally).map(([name,t])=>({name,qty:t.qty,rounds:t.rounds.size})).sort((a,b)=>b.qty-a.qty);
  v.innerHTML=`${bannerLive()}<div class="card"><h2>每人累計拿取</h2><p class="hint">所有分配期加總；拿多的人下次可優先讓給拿少的。</p>
    <div class="tablewrap"><table><thead><tr><th>#</th><th>成員</th><th class="tnum">累計件數</th><th class="tnum">參與期數</th></tr></thead><tbody>${trows.length?trows.map((x,i)=>`<tr><td class="muted tnum">${i+1}</td><td class="name">${esc(x.name)}</td><td class="tnum">${x.qty}</td><td class="tnum">${x.rounds}</td></tr>`).join(""):'<tr><td colspan="4" class="empty">尚無紀錄</td></tr>'}</tbody></table></div></div>
  ${rounds.map(r=>{const al=allocOf(r.id);return `<div class="card"><h2 style="font-size:16px">${esc(r.name)} <span class="chip">${esc(r.date||"")}</span> ${r.status==="已封存"?'<span class="chip">已封存</span>':'<span class="chip wish">進行中</span>'}</h2>${al.length?`<div class="tablewrap" style="margin-top:8px"><table><tbody>${Object.entries(al.reduce((o,a)=>{(o[a.member]=o[a.member]||[]).push(a.item);return o;},{})).map(([mem,items])=>`<tr><td class="name">${esc(mem)}</td><td>${items.map(i=>`<span class="chip got">${iconFor(i)} ${esc(i)}</span>`).join(" ")}</td></tr>`).join("")}</tbody></table></div>`:'<p class="empty">此期尚未分配</p>'}</div>`;}).join("")}`;
}
function renderHelp(){
  const v=$("#view");
  v.innerHTML=`<div class="banner info"><div><b>三步驟</b>　① 確認戰利品　② 上傳截圖（自動排除別家族）　③ 依綜合表現分配、產生清單。</div></div>
  <div class="card"><h2>流程說明</h2>
    <details class="help" open><summary>① 本期戰利品</summary><p>建立分配期，輸入這次的稀有物品與數量。</p></details>
    <details class="help"><summary>② 上傳資料</summary><p>上傳「家族貢獻」「夢域尋光」「搶占藥田」「家族盛會」截圖（可多張）。我辨識後只保留名單上的家族成員，其他家族自動排除。貢獻計分數，活動只計名次。第一次會請你允許使用 Claude 辨識。沒辦法辨識時可改貼文字。</p></details>
    <details class="help"><summary>③ 本期分配</summary><p>系統算出每人<b>綜合分</b>（貢獻＋活動名次）並排名，建議前⅓給3份、次⅓給2份、其餘1份。用成員右側<b>下拉選單</b>選物品即發放，庫存自動 −1；分完變紅字、下拉不再出現該物品。按「產生清單」複製公告，分完「封存本期」進歷史。</p></details>
  </div>
  <div class="card"><h2>想讓成員免帳號自己許願？</h2><p class="hint">目前共享資料庫只對有 Claude 帳號、被授權的人開放。要讓全家族不用帳號自己許願，需另外做網站版。</p></div>`;
}

/* ---------- 事件 ---------- */
$("#tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;activeTab=b.dataset.tab;[...$("#tabs").children].forEach(t=>t.setAttribute("aria-selected",t===b));render();window.scrollTo(0,0);});
$("#fileInput").addEventListener("change",e=>{const f=e.target.files;e.target.value="";handleFiles(f);});
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const act=el.dataset.act;
  if(act==="go"){activeTab=el.dataset.to;[...$("#tabs").children].forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===activeTab));render();window.scrollTo(0,0);return;}
  if(act==="pick"){pendingUpKey=el.dataset.key;$("#fileInput").click();return;}
  if(act==="confirmUp")return confirmUpload(el.dataset.key);
  if(act==="redoUp"){upUI[el.dataset.key]={};return render();}
  if(act==="pasteUp"){const t=$("#pz_"+el.dataset.key);return importPaste(el.dataset.key,t?t.value:"");}
  if(act==="addAct"){const n=$("#newActName")?$("#newActName").value.trim():"";return addActivity(n);}
  if(act==="delAct")return delActivity(el.dataset.key);
  if(act==="createRound"){const n=$("#nrName").value.trim(),d=$("#nrDate").value.trim()||new Date().toISOString().slice(0,10);return createRound(n,d);}
  if(act==="addLoot"){const n=$("#newLootName").value.trim(),q=$("#newLootQty").value;if(!n)return toast("請輸入物品名稱",true);return addLoot(n,q);}
  if(act==="lootDec")return lootStep(el.dataset.item,-1);
  if(act==="lootInc")return lootStep(el.dataset.item,1);
  if(act==="setTotal"){const it=el.dataset.item,inp=document.querySelector(`[data-total="${CSS.escape(it)}"]`);return setLootTotal(it,inp.value);}
  if(act==="delLoot")return delLoot(el.dataset.item);
  if(act==="toggleGhost")return toggleGhost(el.dataset.name);
  if(act==="addMember"){const n=$("#newMemName"),r=$("#newMemRole");const nm=(n.value||"").trim();if(!nm)return toast("請輸入名字",true);const role=r?r.value:"普通成員";n.value="";return addMember(nm,role);}
  if(act==="pasteRoster"){const t=$("#pz_roster");return rosterPaste(t?t.value:"");}
  if(act==="rosterAddOne"){const nm=el.dataset.name,sel=document.querySelector(`[data-memrole="${CSS.escape(nm)}"]`);return addMember(nm,sel?sel.value:"普通成員");}
  if(act==="rosterAddAll"){const list=Array.from(document.querySelectorAll("[data-memrole]")).map(s=>({name:s.getAttribute("data-memrole"),role:s.value}));return addMembers(list);}
  if(act==="rosterClear"){upUI.roster=null;return render();}
  if(act==="delWish")return delWish(el.dataset.id);
  if(act==="delAlloc")return delAlloc(el.dataset.id);
  if(act==="resetWeek")return resetWeek();
  if(act==="archive")return archiveActive();
  if(act==="memberWish"){const w=$("#wishWho"),i=$("#wishWhat");if(!w.value||!i.value)return toast("請選名字和物品",true);const nm=w.value,it=i.value;w.value="";i.value="";return addWish(nm,it);}
  if(act==="exportAnn")return exportAnnouncement();
});
document.addEventListener("change",e=>{
  const sl=e.target.closest("[data-slot]");if(sl){changeSlot(sl.dataset.member,sl.dataset.allocid,sl.value);return;}
  const g=e.target.closest("[data-giveto]");if(g&&g.value){const m=g.dataset.giveto,it=g.value;g.value="";addAlloc(m,it);return;}
  const w=e.target.closest("[data-wishfor]");if(w&&w.value){const m=w.dataset.wishfor,it=w.value;w.value="";addWish(m,it);}
});
function exportAnnouncement(){
  const r=activeRound();if(!r)return;const al=allocOf(r.id);
  const by=al.reduce((o,a)=>{(o[a.member]=o[a.member]||[]).push(a.item);return o;},{});
  let txt=`【${r.name}　戰利品分配】\n`;const order=state.roster.map(m=>m.name);
  Object.keys(by).sort((a,b)=>order.indexOf(a)-order.indexOf(b)).forEach(m=>{txt+=`${m}：${by[m].join("、")}\n`;});
  if(!al.length)txt+="（本期尚未分配）\n";
  $("#annWrap").innerHTML=`<label class="fld" style="margin-top:12px">分配清單<textarea id="annText" readonly style="min-height:120px">${esc(txt)}</textarea></label><button class="btn primary sm" id="copyAnn">複製</button>`;
  $("#copyAnn").onclick=async()=>{try{await navigator.clipboard.writeText(txt);toast("已複製");}catch(e){const ta=$("#annText");ta.focus();ta.select();toast("請手動複製（已選取）");}};
}

render();
connect();
</script>
</body>
